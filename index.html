<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2418" />
    <meta name="description" content="Personal website of Yoganatha Pranashakti." />
    <title>Yoganatha Pranashakti</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        background: #061410;
        color: #f3fbf6;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- Panel (satu layar penuh per bagian) ---------- */
      .panel {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 100vh;
        min-height: 100svh;
        overflow: hidden;
      }

      .panel__canvas {
        position: absolute;
        inset: 0;
        z-index: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .panel__inner {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1100px;
        padding: clamp(1.25rem, 5vw, 4rem);
        text-align: center;
        pointer-events: none;
      }

      /* ---------- Hero: langit ---------- */
      .panel--hero {
        background: linear-gradient(#245c99 0%, #7fa9c9 62%, #dbe8f2 100%);
      }

      .hero__inner {
        will-change: transform, opacity;
      }

      .eyebrow {
        margin: 0 0 clamp(0.9rem, 2.4vw, 1.6rem);
        font-size: clamp(0.78rem, 2.1vw, 1.15rem);
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.95);
        text-shadow: 0 2px 22px rgba(6, 32, 58, 0.45);
        animation: rise-in 1s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }

      .name {
        margin: 0;
        font-size: clamp(2.1rem, 8.5vw, 6rem);
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.025em;
        color: #ffffff;
        text-shadow: 0 10px 50px rgba(4, 26, 48, 0.45);
        animation: rise-in 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- Petunjuk scroll ---------- */
      .scroll-hint {
        position: absolute;
        left: 50%;
        bottom: clamp(1.1rem, 4vh, 2.5rem);
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7rem;
        transform: translateX(-50%);
        font-size: 0.66rem;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(18, 48, 78, 0.6);
        pointer-events: none;
      }

      .scroll-hint i {
        display: block;
        width: 1px;
        height: clamp(26px, 5vh, 42px);
        background: linear-gradient(
          to bottom,
          rgba(18, 48, 78, 0.75),
          rgba(18, 48, 78, 0)
        );
        animation: hint-bob 2.4s ease-in-out infinite;
      }

      @keyframes hint-bob {
        0%,
        100% {
          transform: translateY(-5px);
          opacity: 0.35;
        }
        50% {
          transform: translateY(5px);
          opacity: 1;
        }
      }

      /* ---------- Awan ---------- */
      .panel--clouds {
        background: linear-gradient(#245c99 0%, #b8d4e8 55%, #0b2418 100%);
      }

      /* ---------- Terrain / kontur ---------- */
      .panel--terrain {
        background:
          linear-gradient(to bottom, #0b2418 0%, rgba(11, 36, 24, 0) 20%),
          radial-gradient(
            120vmax 90vmax at 50% 38%,
            #0f2f20 0%,
            #082018 42%,
            #03100b 72%,
            #010705 100%
          );
      }

      .terrain__title {
        margin: 0;
        font-size: clamp(2.2rem, 8vw, 5.5rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(
          100deg,
          #e8ffd9,
          #a7f3c4,
          #4ade80 60%,
          #22c55e
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 6px 40px rgba(34, 197, 94, 0.3));
      }

      .reveal {
        opacity: 0;
        transform: translateY(26px);
        transition:
          opacity 1s cubic-bezier(0.16, 1, 0.3, 1),
          transform 1s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .reveal.is-visible {
        opacity: 1;
        transform: none;
      }

      /* ---------- Layar pendek (HP landscape) ---------- */
      @media (max-height: 520px) {
        .name {
          font-size: clamp(1.6rem, 8.5vh, 3rem);
        }

        .eyebrow {
          margin-bottom: 0.6rem;
          font-size: 0.64rem;
          letter-spacing: 0.18em;
        }

        .scroll-hint {
          display: none;
        }
      }

      /* ---------- Preferensi gerak minimal ---------- */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        .eyebrow,
        .name,
        .scroll-hint i {
          animation: none;
        }

        .reveal {
          opacity: 1;
          transform: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- 1. Hero: langit -->
      <section class="panel panel--hero" id="hero">
        <canvas class="panel__canvas" data-scene="hero" aria-hidden="true"></canvas>
        <div class="panel__inner hero__inner">
          <p class="eyebrow">Welcome to My Personal Website</p>
          <h1 class="name">Yoganatha Pranashakti</h1>
        </div>
        <div class="scroll-hint" aria-hidden="true">
          <span>Scroll</span>
          <i></i>
        </div>
      </section>

      <!-- 2. Awan -->
      <section class="panel panel--clouds" id="clouds" aria-label="Clouds">
        <canvas class="panel__canvas" data-scene="clouds" aria-hidden="true"></canvas>
      </section>

      <!-- 3. Terrain (kontur topografi) -->
      <section class="panel panel--terrain" id="terrain">
        <canvas class="panel__canvas" data-scene="terrain" aria-hidden="true"></canvas>
        <div class="panel__inner">
          <h2 class="terrain__title reveal">Hello World</h2>
        </div>
      </section>
    </main>

    <script>
      (() => {
        "use strict";

        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        const isSmall = window.matchMedia("(max-width: 768px)").matches;

        /* =========================================================
         * Helper WebGL
         * ======================================================= */
        const VERT = `
attribute vec2 aPos;
void main() {
  gl_Position = vec4(aPos, 0.0, 1.0);
}
`;

        const NOISE = `
float hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = p * 2.03 + 11.7;
    a *= 0.5;
  }
  return v;
}
`;

        const scenes = [];

        function compileShader(gl, type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error(gl.getShaderInfoLog(shader));
            return null;
          }
          return shader;
        }

        function makeScene(canvas, fragmentSource, uniformNames, options) {
          const alpha = Boolean(options && options.alpha);
          const gl = canvas.getContext("webgl", {
            antialias: false,
            alpha,
            premultipliedAlpha: alpha,
            powerPreference: "high-performance",
          });
          if (!gl) {
            canvas.remove();
            return null;
          }

          // dFdx/dFdy butuh extension ini di WebGL 1.
          if (fragmentSource.indexOf("GL_OES_standard_derivatives") !== -1) {
            gl.getExtension("OES_standard_derivatives");
          }

          const vs = compileShader(gl, gl.VERTEX_SHADER, VERT);
          const fs = compileShader(gl, gl.FRAGMENT_SHADER, fragmentSource);
          if (!vs || !fs) {
            canvas.remove();
            return null;
          }

          const program = gl.createProgram();
          gl.attachShader(program, vs);
          gl.attachShader(program, fs);
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error(gl.getProgramInfoLog(program));
            canvas.remove();
            return null;
          }
          gl.useProgram(program);

          const buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1, -1, 3, -1, -1, 3]),
            gl.STATIC_DRAW,
          );
          const aPos = gl.getAttribLocation(program, "aPos");
          gl.enableVertexAttribArray(aPos);
          gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

          const u = {};
          for (const name of ["uRes", "uTime", ...uniformNames]) {
            u[name] = gl.getUniformLocation(program, name);
          }

          const scene = {
            canvas,
            gl,
            u,
            visible: false,
            time: 0,
            dirty: true,
            dpr: 1,
            w: 0,
            h: 0,
          };
          scenes.push(scene);
          return scene;
        }

        function fit(scene) {
          const rect = scene.canvas.getBoundingClientRect();
          const w = Math.max(1, Math.round(rect.width));
          const h = Math.max(1, Math.round(rect.height));
          const dpr = Math.min(window.devicePixelRatio || 1, isSmall ? 1.5 : 2);
          if (w === scene.w && h === scene.h && dpr === scene.dpr) return;
          scene.w = w;
          scene.h = h;
          scene.dpr = dpr;
          scene.canvas.width = Math.round(w * dpr);
          scene.canvas.height = Math.round(h * dpr);
          scene.gl.viewport(0, 0, scene.canvas.width, scene.canvas.height);
          scene.dirty = true;
        }

        /* =========================================================
         * 1. Hero — langit cerah realistis
         * ======================================================= */
        const HERO_FRAG = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
${NOISE}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float aspect = uRes.x / uRes.y;
  float h = clamp(uv.y, 0.0, 1.0);

  // Gradasi langit: biru pekat di atas, pucat di horizon.
  vec3 zenith  = vec3(0.086, 0.263, 0.478);
  vec3 middle  = vec3(0.337, 0.573, 0.780);
  vec3 horizon = vec3(0.859, 0.910, 0.949);
  vec3 col = mix(horizon, middle, smoothstep(0.0, 0.58, h));
  col = mix(col, zenith, smoothstep(0.42, 1.0, h));

  // Matahari di kanan atas.
  vec2 sunUv = vec2(0.68, 0.77);
  float d = length((uv - sunUv) * vec2(aspect, 1.0));
  // Cahaya matahari dilepas di kaki langit supaya warnanya rata dan mulus
  // saat menyambung ke section awan.
  float sunFade = smoothstep(0.0, 0.18, uv.y);
  col += vec3(1.0, 0.95, 0.86) * 0.42 * exp(-d * 2.6) * sunFade;
  col += vec3(1.0, 0.98, 0.94) * (1.0 - smoothstep(0.028, 0.042, d)) * 0.95;

  // Kabut tipis yang bergerak sangat pelan.
  float haze = fbm(vec2(p.x * 1.1 + uTime * 0.006, p.y * 2.4 - uTime * 0.002));
  col = mix(col, vec3(0.93, 0.96, 0.99), haze * 0.10 * smoothstep(0.1, 0.85, h));

  // Vignette halus supaya teks terbaca (dilepas di kaki langit agar mulus
  // menyambung ke section awan).
  float vignette = smoothstep(0.45, 1.25, length(p * vec2(0.95, 1.0)));
  col *= 1.0 - 0.14 * vignette * smoothstep(0.0, 0.30, uv.y);

  gl_FragColor = vec4(col, 1.0);
}
`;

        /* =========================================================
         * 2. Awan — volumetrik lembut, melayang pelan
         * ======================================================= */
        const CLOUD_FRAG = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
${NOISE}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  // Skala mengikuti sisi terpendek supaya awan tidak "terlalu dekat"
  // di layar potret (mobile).
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);

  vec3 skyTop = vec3(0.141, 0.361, 0.600);
  vec3 skyBot = vec3(0.722, 0.831, 0.910);
  vec3 sky = mix(skyBot, skyTop, smoothstep(0.0, 1.0, uv.y));

  // Awan: noise berlapis + domain warping pelan.
  vec2 q = vec2(p.x * 1.9, p.y * 2.2);
  q += vec2(uTime * 0.012, uTime * 0.004);
  float warp = fbm(q * 0.7 + 2.3);
  vec2 qw = q + vec2(warp - 0.5, (warp - 0.5) * 0.7) * 1.6;

  float base = fbm(qw);
  float detail = fbm(qw * 2.6 + 5.1);
  float n = base * 0.74 + detail * 0.36;

  float cloud = smoothstep(0.46, 0.70, n);
  // Tidak ada awan di kaki langit (melebur ke terrain), menipis di puncak.
  cloud *= smoothstep(0.10, 0.34, uv.y);
  cloud *= 1.0 - 0.6 * smoothstep(0.86, 1.0, uv.y);

  vec3 shade = mix(vec3(0.90, 0.92, 0.95), vec3(1.0, 1.0, 0.99),
                   smoothstep(0.50, 0.84, n));
  vec3 col = mix(sky, shade, cloud * 0.95);

  // Bagian bawah melebur ke warna terrain (hijau gelap).
  col = mix(col, vec3(0.043, 0.141, 0.094), smoothstep(0.30, 0.0, uv.y));

  // Bagian atas melebur ke warna kaki langit hero, supaya batas section mulus.
  col = mix(col, vec3(0.859, 0.910, 0.949), smoothstep(0.72, 1.0, uv.y));

  gl_FragColor = vec4(col, 1.0);
}
`;

        /* =========================================================
         * 3. Terrain — kontur topografi (port dari 21st.dev)
         * ======================================================= */
        const TOPO_FRAG = `
#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform sampler2D permutation;
uniform vec2 uRes;
uniform float uDpr;
uniform float uFeature;
uniform float uZ;
uniform float uStep;
uniform float uRange;
uniform float uAmount;
uniform float uLift;
uniform float uHillRadius;
uniform vec2 uHill;
uniform vec4 uRipples[4];
uniform float uReach;
uniform float uRippleWidth;
uniform vec3 uColor;

float perm(float i) {
  return floor(texture2D(permutation, vec2((mod(i, 256.0) + 0.5) / 256.0, 0.5)).r * 255.0 + 0.5);
}

float fade(float t) {
  return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
}

float grad(float hash, float x, float y, float z) {
  float h = mod(hash, 16.0);
  float u = h < 8.0 ? x : y;
  float v = h < 4.0 ? y : (h == 12.0 || h == 14.0 ? x : z);
  return (mod(h, 2.0) == 0.0 ? u : -u) + (mod(floor(h / 2.0), 2.0) == 0.0 ? v : -v);
}

float noise(vec3 p) {
  vec3 cell = mod(floor(p), 256.0);
  vec3 f = p - floor(p);
  float u = fade(f.x);
  float v = fade(f.y);
  float w = fade(f.z);
  float A = perm(cell.x) + cell.y;
  float AA = perm(A) + cell.z;
  float AB = perm(A + 1.0) + cell.z;
  float B = perm(cell.x + 1.0) + cell.y;
  float BA = perm(B) + cell.z;
  float BB = perm(B + 1.0) + cell.z;
  return mix(
    mix(
      mix(grad(perm(AA), f.x, f.y, f.z), grad(perm(BA), f.x - 1.0, f.y, f.z), u),
      mix(grad(perm(AB), f.x, f.y - 1.0, f.z), grad(perm(BB), f.x - 1.0, f.y - 1.0, f.z), u),
      v
    ),
    mix(
      mix(grad(perm(AA + 1.0), f.x, f.y, f.z - 1.0), grad(perm(BA + 1.0), f.x - 1.0, f.y, f.z - 1.0), u),
      mix(grad(perm(AB + 1.0), f.x, f.y - 1.0, f.z - 1.0), grad(perm(BB + 1.0), f.x - 1.0, f.y - 1.0, f.z - 1.0), u),
      v
    ),
    w
  );
}

void main() {
  vec2 point = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y) / uDpr;
  vec2 n = point / uFeature;
  float value = noise(vec3(n, uZ)) * 1.1 + noise(vec3(n * 2.1, uZ * 1.7)) * 0.45;
  if (uLift > 0.0) value += uLift * exp(-length(point - uHill) / uHillRadius);
  for (int i = 0; i < 4; i++) {
    vec4 ripple = uRipples[i];
    if (ripple.w > 0.5) {
      float d = length(point - ripple.xy) - ripple.z * uReach;
      value += 0.9 * (1.0 - ripple.z) * cos(d / uRippleWidth * 1.8) * exp(-(d * d) / (2.0 * uRippleWidth * uRippleWidth));
    }
  }
  value *= uAmount;
  float level = (value + uRange) / uStep;
  float nearest = floor(level + 0.5);
  float slope = length(vec2(dFdx(level), dFdy(level)));
  float pixels = abs(level - nearest) / max(slope, 1e-6);
  bool major = mod(nearest, 5.0) == 0.0;
  float width = (major ? 1.5 : 1.0) * uDpr;
  float alpha = slope > 1e-6 ? clamp(width * 0.5 + 0.5 - pixels, 0.0, 1.0) * (major ? 0.85 : 0.4) : 0.0;
  gl_FragColor = vec4(uColor * alpha, alpha);
}
`;

        const PERMUTATION = (() => {
          const table = Array.from({ length: 256 }, (_, i) => i);
          let seed = 1013;
          for (let i = 255; i > 0; i--) {
            seed = (seed * 16807) % 2147483647;
            const j = seed % (i + 1);
            [table[i], table[j]] = [table[j], table[i]];
          }
          return Uint8Array.from([...table, ...table]);
        })();

        /* =========================================================
         * Easing & spring
         * ======================================================= */
        function cubicBezier(x1, y1, x2, y2) {
          const A = (a, b) => 1 - 3 * b + 3 * a;
          const B = (a, b) => 3 * b - 6 * a;
          const C = (a) => 3 * a;
          const calc = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t;
          const slope = (t, a, b) =>
            3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
          return (x) => {
            if (x <= 0) return 0;
            if (x >= 1) return 1;
            let t = x;
            for (let i = 0; i < 8; i++) {
              const s = slope(t, x1, x2);
              if (Math.abs(s) < 1e-6) break;
              const err = calc(t, x1, x2) - x;
              if (Math.abs(err) < 1e-6) break;
              t -= err / s;
            }
            return calc(t, y1, y2);
          };
        }
        const easeRise = cubicBezier(0.16, 1, 0.3, 1);
        const easeRipple = cubicBezier(0.25, 0.4, 0.45, 1);

        function spring(value, stiffness, damping) {
          return { value, target: value, velocity: 0, stiffness, damping };
        }
        function stepSpring(s, dt) {
          const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
          const h = dt / steps;
          for (let i = 0; i < steps; i++) {
            const a =
              -s.stiffness * (s.value - s.target) - s.damping * s.velocity;
            s.velocity += a * h;
            s.value += s.velocity * h;
          }
        }

        /* =========================================================
         * Scene: hero
         * ======================================================= */
        const heroCanvas = document.querySelector('[data-scene="hero"]');
        const hero = makeScene(heroCanvas, HERO_FRAG, []);
        if (hero) {
          hero.draw = () => {
            const { gl, u } = hero;
            gl.uniform2f(u.uRes, hero.canvas.width, hero.canvas.height);
            gl.uniform1f(u.uTime, hero.time);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
          };
        }

        /* =========================================================
         * Scene: awan
         * ======================================================= */
        const cloudCanvas = document.querySelector('[data-scene="clouds"]');
        const cloud = makeScene(cloudCanvas, CLOUD_FRAG, []);
        if (cloud) {
          cloud.draw = () => {
            const { gl, u } = cloud;
            gl.uniform2f(u.uRes, cloud.canvas.width, cloud.canvas.height);
            gl.uniform1f(u.uTime, cloud.time);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
          };
        }

        /* =========================================================
         * Scene: terrain
         * ======================================================= */
        const terrainCanvas = document.querySelector('[data-scene="terrain"]');
        const terrainSection = document.getElementById("terrain");
        const TOPO = {
          feature: 280,
          range: 0.95,
          hillRadius: 90,
          rippleWidth: 60,
          levels: 16,
          speed: 1,
          color: [0x6e / 255, 0xe7 / 255, 0xa0 / 255],
        };

        const terrain = makeScene(
          terrainCanvas,
          TOPO_FRAG,
          [
            "uDpr",
            "uFeature",
            "uZ",
            "uStep",
            "uRange",
            "uAmount",
            "uLift",
            "uHillRadius",
            "uHill",
            "uRipples",
            "uReach",
            "uRippleWidth",
            "uColor",
          ],
          { alpha: true },
        );

        if (terrain) {
          const gl = terrain.gl;

          // Tekstur permutation untuk noise 3D di shader.
          const texture = gl.createTexture();
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
          gl.texImage2D(
            gl.TEXTURE_2D,
            0,
            gl.LUMINANCE,
            256,
            1,
            0,
            gl.LUMINANCE,
            gl.UNSIGNED_BYTE,
            PERMUTATION.subarray(0, 256),
          );
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.uniform1i(terrain.u.permutation, 0);

          gl.uniform1f(terrain.u.uRange, TOPO.range);
          gl.uniform1f(terrain.u.uHillRadius, TOPO.hillRadius);
          gl.uniform1f(terrain.u.uRippleWidth, TOPO.rippleWidth);
          gl.uniform1f(
            terrain.u.uStep,
            (2 * TOPO.range) / TOPO.levels,
          );
          gl.uniform3f(
            terrain.u.uColor,
            TOPO.color[0],
            TOPO.color[1],
            TOPO.color[2],
          );
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          gl.clearColor(0, 0, 0, 0);

          const state = {
            riseStart: null,
            hill: spring(0, 120, 20),
            hillY: spring(0, 120, 20),
            raised: spring(0, 80, 18),
            ripples: [],
          };

          const rippleData = new Float32Array(16);

          terrain.draw = (dt) => {
            if (state.riseStart === null) state.riseStart = terrain.time;
            if (state.hill.value === 0) {
              state.hill.value = state.hill.target = terrain.w / 2;
              state.hillY.value = state.hillY.target = terrain.h / 2;
            }

            let rise = 1;
            if (!reduceMotion) {
              rise = easeRise(
                Math.min(1, (terrain.time - state.riseStart) / 1.8),
              );
              stepSpring(state.hill, dt);
              stepSpring(state.hillY, dt);
              stepSpring(state.raised, dt);
              state.ripples = state.ripples.filter(
                (r) => terrain.time - r.start < 2.6,
              );
              for (const r of state.ripples) {
                r.progress = easeRipple(
                  Math.min(1, (terrain.time - r.start) / 2.6),
                );
              }
            } else {
              state.raised.value = 0;
            }

            rippleData.fill(0);
            const recent = state.ripples.slice(-4);
            for (let i = 0; i < recent.length; i++) {
              rippleData[i * 4] = recent[i].x;
              rippleData[i * 4 + 1] = recent[i].y;
              rippleData[i * 4 + 2] = recent[i].progress;
              rippleData[i * 4 + 3] = 1;
            }

            gl.uniform2f(terrain.u.uRes, terrain.canvas.width, terrain.canvas.height);
            gl.uniform1f(terrain.u.uDpr, terrain.dpr);
            gl.uniform1f(terrain.u.uFeature, TOPO.feature);
            gl.uniform1f(terrain.u.uZ, terrain.time * 0.05 * TOPO.speed);
            gl.uniform1f(terrain.u.uAmount, rise);
            gl.uniform1f(terrain.u.uLift, state.raised.value * 1.5);
            gl.uniform2f(
              terrain.u.uHill,
              state.hill.value,
              state.hillY.value,
            );
            gl.uniform4fv(terrain.u.uRipples, rippleData);
            gl.uniform1f(
              terrain.u.uReach,
              Math.hypot(terrain.w, terrain.h) * 0.8,
            );

            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
          };

          // Interaksi hanya saat kursor di atas section terrain.
          const localPoint = (event) => {
            const rect = terrain.canvas.getBoundingClientRect();
            return { x: event.clientX - rect.left, y: event.clientY - rect.top };
          };

          terrainSection.addEventListener("pointermove", (event) => {
            if (reduceMotion) return;
            const point = localPoint(event);
            state.hill.target = point.x;
            state.hillY.target = point.y;
            state.raised.target = 1;
          });

          terrainSection.addEventListener("pointerleave", () => {
            state.raised.target = 0;
          });

          terrainSection.addEventListener("pointerdown", (event) => {
            if (reduceMotion) return;
            const point = localPoint(event);
            state.hill.target = point.x;
            state.hillY.target = point.y;
            state.ripples.push({
              x: point.x,
              y: point.y,
              start: terrain.time,
              progress: 0,
            });
            state.ripples = state.ripples.slice(-4);
          });
        }

        /* =========================================================
         * Loop tunggal: hanya menggambar scene yang terlihat
         * ======================================================= */
        let raf = 0;
        let last = performance.now();

        function tick(now) {
          raf = requestAnimationFrame(tick);
          const dt = Math.min(now - last, 64) / 1000;
          last = now;
          if (document.hidden) return;

          for (const scene of scenes) {
            if (!scene.visible || !scene.draw) continue;
            fit(scene);
            if (!reduceMotion) scene.time += dt;

            if (reduceMotion) {
              if (!scene.dirty) continue;
              scene.dirty = false;
            }
            scene.draw(dt);
          }
        }

        /* =========================================================
         * Visibilitas & reveal
         * ======================================================= */
        const sceneByCanvas = new Map();
        for (const scene of scenes) sceneByCanvas.set(scene.canvas, scene);

        const io = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              const scene = sceneByCanvas.get(entry.target);
              if (!scene) continue;
              scene.visible = entry.isIntersecting;
              scene.dirty = true;
            }
          },
          { threshold: 0 },
        );
        for (const scene of scenes) io.observe(scene.canvas);

        const revealObserver = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (entry.isIntersecting) entry.target.classList.add("is-visible");
            }
          },
          { threshold: 0.25 },
        );
        document
          .querySelectorAll(".reveal")
          .forEach((el) => revealObserver.observe(el));

        window.addEventListener("resize", () => {
          for (const scene of scenes) {
            fit(scene);
            scene.dirty = true;
          }
        });

        /* =========================================================
         * Parallax ringan di hero
         * ======================================================= */
        const heroInner = document.querySelector(".hero__inner");
        const scrollHint = document.querySelector(".scroll-hint");
        let scrollQueued = false;

        function onScroll() {
          if (scrollQueued || reduceMotion) return;
          scrollQueued = true;
          requestAnimationFrame(() => {
            const progress = Math.min(
              1,
              window.scrollY / (window.innerHeight * 0.85),
            );
            heroInner.style.transform = `translate3d(0, ${progress * -70}px, 0)`;
            heroInner.style.opacity = String(1 - progress);
            scrollHint.style.opacity = String(Math.max(0, 1 - progress * 2));
            scrollQueued = false;
          });
        }

        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();

        // Mulai loop.
        raf = requestAnimationFrame(tick);

        window.addEventListener("pagehide", () => cancelAnimationFrame(raf));
      })();
    </script>
  </body>
</html>
