<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background: #0b0b0f;
        color: #f5f5f7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      h1 {
        margin: 0;
        padding: 0 1.5rem;
        font-size: clamp(2.5rem, 10vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
        background: linear-gradient(90deg, #7dd3fc, #c4b5fd, #fda4af);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    </style>
  </head>
  <body>
    <h1>Hello World</h1>
  </body>
</html>
