<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04120c" />
    <title>Hello World</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #f3fbf6;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        /* Hutan: hijau sangat gelap, sedikit bercahaya di tengah */
        background:
          radial-gradient(
            120vmax 90vmax at 50% 38%,
            #0f2f20 0%,
            #082018 42%,
            #03100b 72%,
            #010705 100%
          );
      }

      /* Kontur topografi digambar di sini */
      #topography {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        padding: 0 1.5rem;
        text-align: center;
        pointer-events: none;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        background: linear-gradient(100deg, #e8ffd9, #a7f3c4, #4ade80 60%, #22c55e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 6px 40px rgba(34, 197, 94, 0.35));
      }

      @media (prefers-reduced-motion: reduce) {
        h1 {
          filter: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="topography" aria-hidden="true"></canvas>
    <main>
      <h1>Hello World</h1>
    </main>

    <script>
      /*
       * Topography background — port vanilla dari "Topography Background"
       * oleh Elliot Sutton (@skyleen77) / Animate UI, 21st.dev.
       * Lisensi asli: MIT with Commons Clause.
       * https://21st.dev/@skyleen77/components/backgrounds-topography
       *
       * Diubah: tema hijau hutan, tanpa dependensi React/motion.
       */
      (() => {
        const FEATURE = 280;
        const RANGE = 0.95;
        const HILL_RADIUS = 90;
        const RIPPLE_WIDTH = 60;
        const LEVELS = 16;
        const SPEED = 1;
        const SCALE = 1;
        const PEAK = 1;
        const LINE_COLOR = "#6ee7a0";

        const PERMUTATION = (() => {
          const table = Array.from({ length: 256 }, (_, i) => i);
          let seed = 1013;
          for (let i = 255; i > 0; i--) {
            seed = (seed * 16807) % 2147483647;
            const j = seed % (i + 1);
            [table[i], table[j]] = [table[j], table[i]];
          }
          return Uint8Array.from([...table, ...table]);
        })();

        const VERTEX = `
attribute vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

        const FRAGMENT = `
#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform sampler2D permutation;
uniform vec2 size;
uniform float dpr;
uniform float feature;
uniform float z;
uniform float step;
uniform float range;
uniform float amount;
uniform float lift;
uniform float hillRadius;
uniform vec2 hill;
uniform vec4 ripples[4];
uniform float reach;
uniform float rippleWidth;
uniform vec3 color;

float perm(float i) {
  return floor(texture2D(permutation, vec2((mod(i, 256.0) + 0.5) / 256.0, 0.5)).r * 255.0 + 0.5);
}

float fade(float t) {
  return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
}

float grad(float hash, float x, float y, float z) {
  float h = mod(hash, 16.0);
  float u = h < 8.0 ? x : y;
  float v = h < 4.0 ? y : (h == 12.0 || h == 14.0 ? x : z);
  return (mod(h, 2.0) == 0.0 ? u : -u) + (mod(floor(h / 2.0), 2.0) == 0.0 ? v : -v);
}

float noise(vec3 p) {
  vec3 cell = mod(floor(p), 256.0);
  vec3 f = p - floor(p);
  float u = fade(f.x);
  float v = fade(f.y);
  float w = fade(f.z);
  float A = perm(cell.x) + cell.y;
  float AA = perm(A) + cell.z;
  float AB = perm(A + 1.0) + cell.z;
  float B = perm(cell.x + 1.0) + cell.y;
  float BA = perm(B) + cell.z;
  float BB = perm(B + 1.0) + cell.z;
  return mix(
    mix(
      mix(grad(perm(AA), f.x, f.y, f.z), grad(perm(BA), f.x - 1.0, f.y, f.z), u),
      mix(grad(perm(AB), f.x, f.y - 1.0, f.z), grad(perm(BB), f.x - 1.0, f.y - 1.0, f.z), u),
      v
    ),
    mix(
      mix(grad(perm(AA + 1.0), f.x, f.y, f.z - 1.0), grad(perm(BA + 1.0), f.x - 1.0, f.y, f.z - 1.0), u),
      mix(grad(perm(AB + 1.0), f.x, f.y - 1.0, f.z - 1.0), grad(perm(BB + 1.0), f.x - 1.0, f.y - 1.0, f.z - 1.0), u),
      v
    ),
    w
  );
}

void main() {
  vec2 point = vec2(gl_FragCoord.x, size.y - gl_FragCoord.y) / dpr;
  vec2 n = point / feature;
  float value = noise(vec3(n, z)) * 1.1 + noise(vec3(n * 2.1, z * 1.7)) * 0.45;
  if (lift > 0.0) value += lift * exp(-length(point - hill) / hillRadius);
  for (int i = 0; i < 4; i++) {
    vec4 ripple = ripples[i];
    if (ripple.w > 0.5) {
      float d = length(point - ripple.xy) - ripple.z * reach;
      value += 0.9 * (1.0 - ripple.z) * cos(d / rippleWidth * 1.8) * exp(-(d * d) / (2.0 * rippleWidth * rippleWidth));
    }
  }
  value *= amount;
  float level = (value + range) / step;
  float nearest = floor(level + 0.5);
  float slope = length(vec2(dFdx(level), dFdy(level)));
  float pixels = abs(level - nearest) / max(slope, 1e-6);
  bool major = mod(nearest, 5.0) == 0.0;
  float width = (major ? 1.5 : 1.0) * dpr;
  float alpha = slope > 1e-6 ? clamp(width * 0.5 + 0.5 - pixels, 0.0, 1.0) * (major ? 0.85 : 0.4) : 0.0;
  gl_FragColor = vec4(color * alpha, alpha);
}
`;

        const canvas = document.getElementById("topography");
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        const gl = canvas.getContext("webgl", {
          premultipliedAlpha: true,
          preserveDrawingBuffer: true,
          antialias: false,
        });

        // ---- Easing (cubic-bezier) -------------------------------------
        function cubicBezier(x1, y1, x2, y2) {
          const A = (a, b) => 1 - 3 * b + 3 * a;
          const B = (a, b) => 3 * b - 6 * a;
          const C = (a) => 3 * a;
          const calc = (t, a, b) => ((A(a, b) * t + B(a, b)) * t + C(a)) * t;
          const slope = (t, a, b) => 3 * A(a, b) * t * t + 2 * B(a, b) * t + C(a);
          return (x) => {
            if (x <= 0) return 0;
            if (x >= 1) return 1;
            let t = x;
            for (let i = 0; i < 8; i++) {
              const s = slope(t, x1, x2);
              if (Math.abs(s) < 1e-6) break;
              const err = calc(t, x1, x2) - x;
              if (Math.abs(err) < 1e-6) break;
              t -= err / s;
            }
            return calc(t, y1, y2);
          };
        }
        const easeRise = cubicBezier(0.16, 1, 0.3, 1);
        const easeRipple = cubicBezier(0.25, 0.4, 0.45, 1);

        // ---- Spring sederhana (pengganti motion) -----------------------
        function spring(value, stiffness, damping) {
          return { value, target: value, velocity: 0, stiffness, damping };
        }
        function stepSpring(s, dt) {
          const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
          const h = dt / steps;
          for (let i = 0; i < steps; i++) {
            const a =
              -s.stiffness * (s.value - s.target) - s.damping * s.velocity;
            s.velocity += a * h;
            s.value += s.velocity * h;
          }
        }

        // ---- State -----------------------------------------------------
        const state = {
          width: 0,
          height: 0,
          dpr: 1,
          time: 0,
          started: 0,
          rise: reduceMotion ? 1 : 0,
          hill: spring(0, 120, 20),
          hillY: spring(0, 120, 20),
          raised: spring(0, 80, 18),
          ripples: [],
        };

        if (reduceMotion) state.raised.value = 0;

        const toRgb = (hex) => {
          const v = parseInt(hex.slice(1), 16);
          return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
        };
        const LINE_RGB = toRgb(LINE_COLOR);

        // ---- Renderer WebGL --------------------------------------------
        let render = null;

        if (gl && gl.getExtension("OES_standard_derivatives")) {
          const compile = (type, source) => {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
              console.error(gl.getShaderInfoLog(shader));
              return null;
            }
            return shader;
          };

          const vertex = compile(gl.VERTEX_SHADER, VERTEX);
          const fragment = compile(gl.FRAGMENT_SHADER, FRAGMENT);
          const program = gl.createProgram();
          gl.attachShader(program, vertex);
          gl.attachShader(program, fragment);
          gl.linkProgram(program);

          if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
            gl.useProgram(program);

            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(
              gl.ARRAY_BUFFER,
              new Float32Array([-1, -1, 3, -1, -1, 3]),
              gl.STATIC_DRAW,
            );
            const position = gl.getAttribLocation(program, "position");
            gl.enableVertexAttribArray(position);
            gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

            const texture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
            gl.texImage2D(
              gl.TEXTURE_2D,
              0,
              gl.LUMINANCE,
              256,
              1,
              0,
              gl.LUMINANCE,
              gl.UNSIGNED_BYTE,
              PERMUTATION.subarray(0, 256),
            );
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

            const u = (name) => gl.getUniformLocation(program, name);
            const uniforms = {
              permutation: u("permutation"),
              size: u("size"),
              dpr: u("dpr"),
              feature: u("feature"),
              z: u("z"),
              step: u("step"),
              range: u("range"),
              amount: u("amount"),
              lift: u("lift"),
              hillRadius: u("hillRadius"),
              hill: u("hill"),
              ripples: u("ripples") || u("ripples[0]"),
              reach: u("reach"),
              rippleWidth: u("rippleWidth"),
              color: u("color"),
            };

            gl.uniform1i(uniforms.permutation, 0);
            gl.uniform1f(uniforms.range, RANGE);
            gl.uniform1f(uniforms.hillRadius, HILL_RADIUS);
            gl.uniform1f(uniforms.rippleWidth, RIPPLE_WIDTH);

            const rippleData = new Float32Array(16);
            const step = (2 * RANGE) / LEVELS;

            render = () => {
              const w = Math.max(1, Math.round(state.width * state.dpr));
              const h = Math.max(1, Math.round(state.height * state.dpr));
              gl.viewport(0, 0, w, h);
              gl.uniform2f(uniforms.size, w, h);
              gl.uniform1f(uniforms.dpr, state.dpr);
              gl.uniform1f(uniforms.feature, FEATURE * SCALE);
              gl.uniform1f(uniforms.z, state.time * 0.00005 * SPEED);
              gl.uniform1f(uniforms.step, step);
              gl.uniform1f(uniforms.amount, state.rise);
              gl.uniform1f(
                uniforms.lift,
                state.raised.value * PEAK * 1.5,
              );
              gl.uniform2f(
                uniforms.hill,
                state.hill.value,
                state.hillY.value,
              );

              rippleData.fill(0);
              const recent = state.ripples.slice(-4);
              for (let i = 0; i < recent.length; i++) {
                const r = recent[i];
                rippleData[i * 4] = r.x;
                rippleData[i * 4 + 1] = r.y;
                rippleData[i * 4 + 2] = r.progress;
                rippleData[i * 4 + 3] = 1;
              }
              gl.uniform4fv(uniforms.ripples, rippleData);
              gl.uniform1f(
                uniforms.reach,
                Math.hypot(state.width, state.height) * 0.8,
              );
              gl.uniform3f(uniforms.color, LINE_RGB[0], LINE_RGB[1], LINE_RGB[2]);

              gl.clearColor(0, 0, 0, 0);
              gl.clear(gl.COLOR_BUFFER_BIT);
              gl.drawArrays(gl.TRIANGLES, 0, 3);
            };
          }
        }

        if (!render) {
          // WebGL tidak tersedia: biarkan latar gradien CSS saja.
          canvas.remove();
        }

        // ---- Resize ----------------------------------------------------
        function resize() {
          state.width = window.innerWidth;
          state.height = window.innerHeight;
          state.dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
          if (canvas.isConnected) {
            canvas.width = Math.max(1, Math.round(state.width * state.dpr));
            canvas.height = Math.max(1, Math.round(state.height * state.dpr));
          }
          if (state.hill.value === 0) {
            state.hill.value = state.hill.target = state.width / 2;
            state.hillY.value = state.hillY.target = state.height / 2;
          }
        }

        // ---- Interaksi -------------------------------------------------
        let pointerInside = false;

        window.addEventListener("pointermove", (event) => {
          if (reduceMotion) return;
          pointerInside = true;
          state.hill.target = event.clientX;
          state.hillY.target = event.clientY;
          state.raised.target = 1;
        });

        window.addEventListener("pointerleave", () => {
          pointerInside = false;
          state.raised.target = 0;
        });

        window.addEventListener("blur", () => {
          pointerInside = false;
          state.raised.target = 0;
        });

        window.addEventListener("pointerdown", (event) => {
          if (reduceMotion) return;
          state.hill.target = event.clientX;
          state.hillY.target = event.clientY;
          state.ripples.push({
            x: event.clientX,
            y: event.clientY,
            start: performance.now(),
            progress: 0,
          });
          state.ripples = state.ripples.slice(-4);
        });

        // ---- Loop ------------------------------------------------------
        let raf = 0;
        let last = 0;
        let visible = !document.hidden;

        document.addEventListener("visibilitychange", () => {
          visible = !document.hidden;
          if (visible) {
            last = 0;
            if (render) raf = requestAnimationFrame(frame);
          } else {
            cancelAnimationFrame(raf);
          }
        });

        function updateRipples(now) {
          state.ripples = state.ripples.filter(
            (r) => now - r.start < 2600,
          );
          for (const r of state.ripples) {
            const t = Math.min(1, (now - r.start) / 2600);
            r.progress = easeRipple(t);
          }
        }

        function frame(now) {
          const delta = last ? Math.min(now - last, 64) : 16;
          last = now;
          const dt = delta / 1000;

          if (!reduceMotion) {
            if (state.rise < 1) {
              state.rise = easeRise(Math.min(1, (now - state.started) / 1800));
            }
            state.time += delta;
            stepSpring(state.hill, dt);
            stepSpring(state.hillY, dt);
            stepSpring(state.raised, dt);
            updateRipples(now);
          }

          if (render) render();
          raf = requestAnimationFrame(frame);
        }

        resize();
        window.addEventListener("resize", resize);

        if (reduceMotion) {
          state.started = 0;
          if (render) render();
        } else {
          state.started = performance.now();
          if (render) raf = requestAnimationFrame(frame);
        }
      })();
    </script>
  </body>
</html>
